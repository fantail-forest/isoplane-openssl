name: Isoplane fork checks
on:
  push:
    branches: [isoplane-revisions]
  pull_request:
    branches: [isoplane-revisions]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: isoplane-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: Native crypto tests and WASI library build
    if: github.repository == 'fantail-forest/isoplane-openssl'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - name: Build native libraries and tests
        run: |
          mkdir build-native
          cd build-native
          perl ../Configure linux-x86_64 no-shared no-threads no-asm
          make -j2
      - name: Test native random generation and EVP
        working-directory: build-native
        run: make test TESTS='test_rand test_evp' HARNESS_JOBS=2
      - name: Install the pinned WASI SDK
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --location --retry 3 https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-29/wasi-sdk-29.0-x86_64-linux.tar.gz -o wasi-sdk.tar.gz
          echo '87d1d1a2879d139cdc624b968efad3d4a97b8078cdff95e63ac88ecafd1a0171  wasi-sdk.tar.gz' | sha256sum --check
          mkdir wasi-sdk
          tar --strip-components=1 -xzf wasi-sdk.tar.gz -C wasi-sdk
          rm wasi-sdk.tar.gz
      - name: Build WASI libraries with the Isoplane configuration
        env:
          WASI_SDK_PATH: ${{ runner.temp }}/wasi-sdk
        run: |
          bash util/isoplane-build-wasi.sh build-wasi "$RUNNER_TEMP/openssl-wasi" 2
      - name: Package the WASI libraries
        run: |
          cp LICENSE.txt "$RUNNER_TEMP/openssl-wasi/"
          jq -n --arg revision "$GITHUB_SHA" --arg sdk "$(cat "$RUNNER_TEMP/wasi-sdk/VERSION")" \
            '{source_revision: $revision, wasi_sdk: $sdk}' > "$RUNNER_TEMP/openssl-wasi/source.json"
          tar -czf openssl-wasi.tar.gz -C "$RUNNER_TEMP/openssl-wasi" .
          sha256sum openssl-wasi.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openssl-wasi
          path: |
            openssl-wasi.tar.gz
            SHA256SUMS
          retention-days: 1
          compression-level: 0
      - name: Record disk consumption
        if: always()
        run: df -h .

  publish:
    needs: check
    if: github.repository == 'fantail-forest/isoplane-openssl' && github.ref == 'refs/heads/isoplane-revisions' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {name: openssl-wasi}
      - name: Publish revision-specific WASI libraries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="isoplane-wasi-$GITHUB_SHA"
          if draft=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" = false ]; then
              echo "Release $tag is already published."
              exit 0
            fi
          else
            gh release create "$tag" --target "$GITHUB_SHA" --draft --prerelease \
              --title "Isoplane WASI libraries $GITHUB_SHA" \
              --notes 'Static WASI OpenSSL libraries built and tested from this revision. Includes the original license and source identity.'
          fi
          gh release upload "$tag" openssl-wasi.tar.gz SHA256SUMS --clobber
          gh release edit "$tag" --draft=false --latest=false
