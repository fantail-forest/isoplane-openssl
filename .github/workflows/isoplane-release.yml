name: Isoplane build release
on:
  workflow_dispatch:
    inputs:
      revision:
        description: Full commit on isoplane-revisions whose build to keep as a release
        required: true
        type: string
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  release:
    name: Keep a revision's WASI libraries as a release
    if: github.repository == 'fantail-forest/isoplane-openssl'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      REVISION: ${{ inputs.revision }}
    steps:
      - name: Require a landed revision
        run: |
          [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]] || { echo "Give the full 40-character commit." >&2; exit 1; }
          status=$(gh api "repos/$GH_REPO/compare/isoplane-revisions...$REVISION" --jq .status)
          case "$status" in
            identical|behind) ;;
            *) echo "$REVISION is not on isoplane-revisions ($status)." >&2; exit 1 ;;
          esac
      - name: Download the revision's build
        run: |
          run=$(gh api "repos/$GH_REPO/actions/runs?head_sha=$REVISION&per_page=100" --jq '
            [.workflow_runs[] | select(.path == ".github/workflows/isoplane.yml" and .event != "pull_request" and .conclusion == "success")]
            | first | .id // empty')
          [ -n "$run" ] || { echo "No successful build of $REVISION exists; push a branch at it to build one." >&2; exit 1; }
          gh run download "$run" --name openssl-wasi --dir .
          sha256sum --check SHA256SUMS
      - name: Publish revision-specific WASI libraries
        run: |
          tag="isoplane-wasi-$REVISION"
          if draft=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" = false ]; then
              echo "Release $tag is already published."
              exit 0
            fi
          else
            gh release create "$tag" --target "$REVISION" --draft --prerelease \
              --title "Isoplane WASI libraries $REVISION" \
              --notes 'Static WASI OpenSSL libraries built and tested from this revision. Includes the original license and source identity.'
          fi
          gh release upload "$tag" openssl-wasi.tar.gz SHA256SUMS --clobber
          gh release edit "$tag" --draft=false --latest=false
